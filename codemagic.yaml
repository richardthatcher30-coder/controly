workflows:
  # Fast, unsigned compile-bar check — confirms the Kotlin/Native framework
  # links and Xcode can build against it, without touching any signing
  # configuration at all. Use this for day-to-day iteration.
  ios-debug:
    name: iOS Debug (unsigned compile check)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups: []
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
    scripts:
      - name: Build Kotlin/Native framework (debug, simulator)
        script: |
          ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64
      - name: Build Xcode project for the simulator (unsigned)
        script: |
          xcodebuild build \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  # Signed release build + optional TestFlight publish. Signing credentials
  # come from the "Creswick Media Limited" Apple Developer Portal integration
  # connected in the CodeMagic UI (Team > Integrations > Developer Portal) —
  # CodeMagic manages the App Store Connect API key and persists generated
  # certificates/profiles itself, so no manual APP_STORE_CONNECT_* variables
  # are needed here. See:
  # https://docs.codemagic.io/yaml-code-signing/signing-ios/ for details.
  ios-release:
    name: iOS Release (signed, App Store Connect)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Creswick Media Limited
    environment:
      # Deliberately NOT using an `ios_signing:` block here: that triggers
      # CodeMagic's own automatic pre-script signing step, which only
      # fetches existing certificates/profiles rather than creating missing
      # ones — it was failing immediately, before any of the scripts below
      # even ran. The "Fetch signing files"/"Use signing files" scripts
      # below (with fetch-signing-files' own --create flag) do the actual
      # creation, using the credentials from the integration above.
      groups:
        - ios_release # holds CERTIFICATE_PRIVATE_KEY once bootstrapped — see the Fetch signing files step
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
    scripts:
      - name: Build Kotlin/Native framework (release, device)
        script: |
          ./gradlew :ios:linkReleaseFrameworkIosArm64
      - name: Fetch signing files
        script: |
          # fetch-signing-files' --create does NOT generate a certificate's
          # private key itself — confirmed against CodeMagic's own CLI docs
          # (docs/app-store-connect/fetch-signing-files.md, certificates/
          # create.md): --certificate-key is required whenever it needs to
          # create a certificate, and it errors instead of generating one.
          # That's the actual cause of every "Cannot save/create ... without
          # certificate private key" failure so far, not an account/cert
          # cleanup issue. Generating our own key here and passing it in.
          #
          # Also: fetch-signing-files has no certificate-type flag, and for
          # an IOS_APP_STORE profile it always creates the classic "iOS
          # Distribution" certificate type — but xcode-project build-ipa
          # defaults CODE_SIGN_IDENTITY to the newer unified "Apple
          # Distribution" regardless (and that default can't be overridden
          # via --archive-xcargs; the tool re-appends its own value after
          # any override, so the last-wins xcodebuild semantics silently
          # discard it). So archiving failed with "No iOS Distribution
          # signing certificate found" even though that exact certificate
          # existed. Fix is to create the certificate CodeMagic actually
          # expects ourselves, first, with the type it can't be told to use
          # here — fetch-signing-files then reuses it instead of creating a
          # mismatched one, since a DISTRIBUTION cert is valid for
          # IOS_APP_STORE profiles too.
          #
          # BUT: generating a fresh key every run doesn't actually work more
          # than once. Apple caps an account at one active Distribution
          # certificate, so the next run's new random key can never match
          # the previous run's now-existing certificate, and creation starts
          # failing with "You already have a current Distribution
          # certificate" (409) -- confirmed happening on the second run.
          # Reuse a persisted key via CERTIFICATE_PRIVATE_KEY (from the
          # ios_release group) once it's been bootstrapped; only the very
          # first run (or one after the account's Distribution certs were
          # manually revoked) generates a fresh one, saved as a build
          # artifact specifically so it can be copied into that group and
          # reused on every run after.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Using persisted CERTIFICATE_PRIVATE_KEY"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/certificate_key.pem
          else
            echo "No CERTIFICATE_PRIVATE_KEY set yet -- generating one (bootstrap run)"
            openssl genrsa -out /tmp/certificate_key.pem 2048
          fi
          cp /tmp/certificate_key.pem "$CM_BUILD_DIR/certificate_key_ADD_TO_ios_release_GROUP.pem"
          app-store-connect certificates create \
            --type DISTRIBUTION \
            --certificate-key @file:/tmp/certificate_key.pem \
            --save
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/certificate_key.pem \
            --create
      - name: Use signing files
        script: |
          xcode-project use-profiles
      - name: Build and archive the app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # Only produced on a bootstrap run (no CERTIFICATE_PRIVATE_KEY set
      # yet) -- download it once, add it as CERTIFICATE_PRIVATE_KEY (Secure)
      # in the ios_release group, then this stops appearing on future runs.
      - "*_ADD_TO_ios_release_GROUP.pem"
    publishing:
      # Enabled: user confirmed intent to get a build (even the Phase 1
      # placeholder) into TestFlight now, to validate the signing/release
      # pipeline end to end. Uses the same connected Developer Portal
      # integration for authentication — no manual API key variables.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - r.thatcher@sky.com
        notify:
          success: true
          failure: true
