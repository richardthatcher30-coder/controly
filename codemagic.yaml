workflows:
  # Fast, unsigned compile-bar check — confirms the Kotlin/Native framework
  # links and Xcode can build against it, without touching any signing
  # configuration at all. Use this for day-to-day iteration.
  ios-debug:
    name: iOS Debug (unsigned compile check)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups: []
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
    scripts:
      - name: Build Kotlin/Native framework (debug, simulator)
        script: |
          ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64
      - name: Build Xcode project for the simulator (unsigned)
        script: |
          xcodebuild build \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  # Signed release build + optional TestFlight publish. Signing credentials
  # come from the "Creswick Media Limited" Apple Developer Portal integration
  # connected in the CodeMagic UI (Team > Integrations > Developer Portal) —
  # CodeMagic manages the App Store Connect API key and persists generated
  # certificates/profiles itself, so no manual APP_STORE_CONNECT_* variables
  # are needed here. See:
  # https://docs.codemagic.io/yaml-code-signing/signing-ios/ for details.
  ios-release:
    name: iOS Release (signed, App Store Connect)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Creswick Media Limited
    environment:
      # Deliberately NOT using an `ios_signing:` block here: that triggers
      # CodeMagic's own automatic pre-script signing step, which only
      # fetches existing certificates/profiles rather than creating missing
      # ones — it was failing immediately, before any of the scripts below
      # even ran. The "Fetch signing files"/"Use signing files" scripts
      # below (with fetch-signing-files' own --create flag) do the actual
      # creation, using the credentials from the integration above.
      groups:
        - ios_release # holds CERTIFICATE_PRIVATE_KEY once bootstrapped — see the Fetch signing files step
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
    scripts:
      - name: Build Kotlin/Native framework (release, device)
        script: |
          ./gradlew :ios:linkReleaseFrameworkIosArm64
      - name: Fetch signing files
        script: |
          # fetch-signing-files' --create does NOT generate a certificate's
          # private key itself — confirmed against CodeMagic's own CLI docs
          # (docs/app-store-connect/fetch-signing-files.md, certificates/
          # create.md): --certificate-key is required whenever it needs to
          # create a certificate, and it errors instead of generating one.
          # That's the actual cause of every "Cannot save/create ... without
          # certificate private key" failure early on, not an account/cert
          # cleanup issue. Generating our own key here and passing it in.
          #
          # Generating a fresh key every run doesn't work more than once,
          # though: Apple caps an account at one active Distribution
          # certificate, so the next run's new random key can never match
          # the previous run's now-existing certificate, and creation starts
          # failing with "You already have a current Distribution
          # certificate" (409). Reuse a persisted key via
          # CERTIFICATE_PRIVATE_KEY (from the ios_release group) once it's
          # been bootstrapped; only the very first run (or one after the
          # account's Distribution certs were manually revoked) generates a
          # fresh one, saved as a build artifact specifically so it can be
          # copied into that group and reused on every run after.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Using persisted CERTIFICATE_PRIVATE_KEY"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/certificate_key.pem
          else
            echo "No CERTIFICATE_PRIVATE_KEY set yet -- generating one (bootstrap run)"
            openssl genrsa -out /tmp/certificate_key.pem 2048
            cp /tmp/certificate_key.pem "$CM_BUILD_DIR/certificate_key_ADD_TO_ios_release_GROUP.pem"
          fi
          # fetch-signing-files only ever writes files to disk (default
          # --certificates-dir: $HOME/Library/Developer/Xcode/UserData/
          # Certificates) — confirmed it does NOT import anything into a
          # keychain itself. xcodebuild archive with manual signing needs
          # the identity to actually be IN a keychain (`security
          # find-identity` found nothing at all, even after a fully
          # successful fetch), so generate a p12 here (--p12-password) and
          # explicitly import it below via the keychain commands, which is
          # the piece that was missing this whole time — not a certificate
          # *type* mismatch as earlier attempts assumed.
          P12_PASSWORD=$(openssl rand -hex 16)
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/certificate_key.pem \
            --p12-password "$P12_PASSWORD" \
            --create
          keychain initialize
          keychain add-certificates \
            -c "$HOME/Library/Developer/Xcode/UserData/Certificates/*.p12" \
            --certificate-password "$P12_PASSWORD" \
            -A
      - name: Use signing files
        script: |
          xcode-project use-profiles
      - name: Build and archive the app
        script: |
          # NOT using xcode-project build-ipa here — confirmed it
          # unconditionally sets CODE_SIGN_IDENTITY to a fixed default when
          # archiving, with no way to override it via --archive-xcargs (the
          # tool whitespace-splits values with spaces instead of
          # shell-quoting them, AND re-appends its own value afterward
          # regardless — xcodebuild's last-value-wins semantics silently
          # discard any override either way).
          #
          # Also stopped guessing at a hardcoded identity string
          # ("iOS Distribution" vs "Apple Distribution") ourselves — which
          # actual certificate type ends up available locally depends on
          # cert/key history from earlier runs (confirmed: it's changed
          # between runs as the signing setup evolved), so hardcoding either
          # name is fragile. Ask the keychain directly what's actually there
          # instead, and use exactly that.
          mkdir -p build/ios/xcarchive build/ios/ipa
          CERT_IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(.*\)".*/\1/p' | head -n1)
          if [ -z "$CERT_IDENTITY" ]; then
            echo "No codesigning identity found in the keychain — Fetch signing files should have installed one."
            exit 1
          fi
          echo "Using codesigning identity: $CERT_IDENTITY"

          xcodebuild archive \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            DEVELOPMENT_TEAM=PVL8GCZUC3

          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>PVL8GCZUC3</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CERT_IDENTITY</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # Only produced on a bootstrap run (no CERTIFICATE_PRIVATE_KEY set
      # yet) -- download it once, add it as CERTIFICATE_PRIVATE_KEY (Secure)
      # in the ios_release group, then this stops appearing on future runs.
      - "*_ADD_TO_ios_release_GROUP.pem"
    publishing:
      # Enabled: user confirmed intent to get a build (even the Phase 1
      # placeholder) into TestFlight now, to validate the signing/release
      # pipeline end to end. Uses the same connected Developer Portal
      # integration for authentication — no manual API key variables.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
